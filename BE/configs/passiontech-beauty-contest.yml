# If you need to convert YAML to a Go struct, please execute the command: make update-config

# app settings
app:
  name: "passiontech-beauty-contest"
  env: "dev" # dev | prod | test
  version: "v1.0.0"
  host: "127.0.0.1"
  enableStat: true
  enableMetrics: false
  enableHTTPProfile: false
  enableLimit: false
  enableCircuitBreaker: false
  enableTrace: false
  tracingSamplingRate: 1.0
  cacheType: "redis" # "memory" | "redis" | ""

# http server settings
http:
  port: 8080
  timeout: 0 # 0 = no timeout, unit(second)

# cors settings
cors:
  allowedOrigins:
    - "http://localhost:3000"
    - "http://localhost:5173"
  allowedMethods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  allowedHeaders: ["Accept", "Authorization", "Content-Type", "X-CSRF-Token"]
  allowCredentials: true
  maxAge: 300

# logger settings
logger:
  level: "info" # debug | info | warn | error
  format: "console" # console | json
  isSave: false

# database settings
database:
  driver: "mongodb"
  mongodb:
    dsn: "${MONGO_URI}" # mongodb://<user>:<password>@<host>:<port>/<db>?directConnection=true
    dbName: "${MONGO_DB}"

# redis settings
redis:
  dsn: "${REDIS_DSN}" # [user]:<pass>@127.0.0.1:6379/[db]
  dialTimeout: 10
  readTimeout: 2
  writeTimeout: 2

# jwt settings
jwt:
  secret: "${JWT_SECRET}"
  expireHours: 72

# upload settings
upload:
  dir: "./uploads"
  publicURL: "http://localhost:8080/uploads"
  maxSizeMB: 10
  allowedTypes: ["image/jpeg", "image/png", "image/webp"]
